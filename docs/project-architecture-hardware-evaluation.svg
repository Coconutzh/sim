<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">项目架构图：个人画布、团队画布、权限、仪表盘、SQL 数据库与媒体资产库</title>
  <desc id="desc">面向硬件评估的系统架构图，展示现有 Sim 项目与新增业务能力在前端、后端、实时服务、数据库和媒体资产库中的模块划分与数据流。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .panel-soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .frontend { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .backend { fill: #f0fdf4; stroke: #059669; stroke-width: 2; rx: 14; }
      .realtime { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .data { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; rx: 14; }
      .asset { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 14; }
      .planned { stroke-dasharray: 8 6; }
      .title { fill: #0f172a; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 18px; }
      .section { fill: #0f172a; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .label { fill: #1e293b; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .text { fill: #334155; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 15px; }
      .small { fill: #475569; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; }
      .tag { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 10; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1080"/>

  <text class="title" x="60" y="62">项目架构图（硬件评估版）</text>
  <text class="subtitle" x="60" y="94">现有 Sim 项目 + 新增个人画布、团队画布、登录权限、进度仪表盘；重点标出 SQL 数据库与媒体资产库。</text>

  <rect class="panel" x="50" y="130" width="260" height="840"/>
  <text class="section" x="80" y="170">用户与访问边界</text>

  <rect class="panel-soft" x="80" y="205" width="200" height="96"/>
  <text class="label" x="110" y="240">个人用户</text>
  <text class="text" x="110" y="268">只访问自己的个人画布</text>
  <text class="small" x="110" y="290">个人草稿、文件、执行记录</text>

  <rect class="panel-soft" x="80" y="325" width="200" height="96"/>
  <text class="label" x="110" y="360">团队成员</text>
  <text class="text" x="110" y="388">查看当前团队画布</text>
  <text class="small" x="110" y="410">受 workspace 权限控制</text>

  <rect class="panel-soft" x="80" y="445" width="200" height="108"/>
  <text class="label" x="110" y="480">总导演 / 领导</text>
  <text class="text" x="110" y="508">查看团队画布与仪表盘</text>
  <text class="small" x="110" y="530">审核、进度、资源占用</text>

  <rect class="panel-soft" x="80" y="590" width="200" height="124"/>
  <text class="label" x="110" y="625">统一登录入口</text>
  <text class="text" x="110" y="653">Better Auth Session</text>
  <text class="small" x="110" y="676">用户、组织、成员关系</text>
  <text class="small" x="110" y="698">权限在 API 与 realtime 双端校验</text>

  <rect class="panel-soft" x="80" y="750" width="200" height="142"/>
  <text class="label" x="110" y="785">访问策略</text>
  <text class="text" x="110" y="813">个人：ownerId = userId</text>
  <text class="text" x="110" y="838">团队：workspace 权限</text>
  <text class="text" x="110" y="863">禁止跨团队查看</text>

  <rect class="panel" x="350" y="130" width="330" height="840"/>
  <text class="section" x="380" y="170">前端应用（apps/sim）</text>
  <text class="small" x="380" y="195">Next.js App Router + ReactFlow + Zustand + React Query</text>

  <rect class="frontend" x="380" y="230" width="270" height="96"/>
  <text class="label" x="410" y="264">画布编辑器</text>
  <text class="text" x="410" y="292">ReactFlow 工作流节点/连线</text>
  <text class="small" x="410" y="314">现有 workflow builder</text>

  <rect class="frontend planned" x="380" y="350" width="270" height="116"/>
  <text class="label" x="410" y="384">个人画布</text>
  <text class="text" x="410" y="412">仅本人可编辑的草稿区</text>
  <text class="small" x="410" y="436">保存到 personal workspace / draft 标记</text>

  <rect class="frontend planned" x="380" y="490" width="270" height="126"/>
  <text class="label" x="410" y="524">团队画布</text>
  <text class="text" x="410" y="552">团队共享视图与协作入口</text>
  <text class="small" x="410" y="576">个人画布完成后发布/上传</text>
  <text class="small" x="410" y="598">总导演查看、管理、归档</text>

  <rect class="frontend planned" x="380" y="640" width="270" height="116"/>
  <text class="label" x="410" y="674">管理仪表盘</text>
  <text class="text" x="410" y="702">各团队进度、状态、成本</text>
  <text class="small" x="410" y="726">按组织/团队聚合查询</text>

  <rect class="frontend" x="380" y="780" width="270" height="116"/>
  <text class="label" x="410" y="814">文件与媒体视图</text>
  <text class="text" x="410" y="842">上传、预览、知识库素材</text>
  <text class="small" x="410" y="866">workspace files / knowledge documents</text>

  <rect class="panel" x="720" y="130" width="380" height="840"/>
  <text class="section" x="750" y="170">后端 API 与业务服务</text>
  <text class="small" x="750" y="195">Next.js API routes + contracts + Drizzle ORM</text>

  <rect class="backend" x="750" y="230" width="310" height="112"/>
  <text class="label" x="780" y="264">认证与授权服务</text>
  <text class="text" x="780" y="292">Better Auth、Session、组织成员</text>
  <text class="small" x="780" y="316">permissions / permission groups / workspace grants</text>

  <rect class="backend planned" x="750" y="365" width="310" height="128"/>
  <text class="label" x="780" y="399">画布编排服务</text>
  <text class="text" x="780" y="427">个人草稿保存、团队发布</text>
  <text class="small" x="780" y="451">publish: personal canvas -> team canvas</text>
  <text class="small" x="780" y="473">保留版本、审核状态、发布人</text>

  <rect class="backend planned" x="750" y="516" width="310" height="116"/>
  <text class="label" x="780" y="550">仪表盘聚合服务</text>
  <text class="text" x="780" y="578">团队进度、画布数量、完成率</text>
  <text class="small" x="780" y="602">读取 workflow logs / team status / usage</text>

  <rect class="backend" x="750" y="655" width="310" height="116"/>
  <text class="label" x="780" y="689">工作流执行引擎</text>
  <text class="text" x="780" y="717">blocks、tools、triggers、executor</text>
  <text class="small" x="780" y="741">可接 LLM、外部工具、异步任务</text>

  <rect class="backend" x="750" y="795" width="310" height="116"/>
  <text class="label" x="780" y="829">媒体与知识库服务</text>
  <text class="text" x="780" y="857">文件上传、下载、元数据</text>
  <text class="small" x="780" y="881">workspace files / knowledge / embeddings</text>

  <rect class="panel" x="1140" y="130" width="390" height="410"/>
  <text class="section" x="1170" y="170">实时协作与异步服务</text>
  <text class="small" x="1170" y="195">apps/realtime + Socket.io + background jobs</text>

  <rect class="realtime" x="1170" y="230" width="315" height="116"/>
  <text class="label" x="1200" y="264">Realtime Socket 服务</text>
  <text class="text" x="1200" y="292">房间、presence、画布操作同步</text>
  <text class="small" x="1200" y="316">同样检查 workspace 权限</text>

  <rect class="realtime" x="1170" y="370" width="315" height="116"/>
  <text class="label" x="1200" y="404">异步/执行任务</text>
  <text class="text" x="1200" y="432">Trigger.dev / DB jobs / webhooks</text>
  <text class="small" x="1200" y="456">长任务、文件处理、执行日志</text>

  <rect class="panel" x="1140" y="575" width="390" height="395"/>
  <text class="section" x="1170" y="615">数据与资产持久化</text>

  <rect class="data" x="1170" y="650" width="315" height="128"/>
  <text class="label" x="1200" y="684">SQL 数据库</text>
  <text class="text" x="1200" y="712">PostgreSQL + pgvector</text>
  <text class="small" x="1200" y="736">user / organization / workspace / member</text>
  <text class="small" x="1200" y="758">workflow / blocks / edges / permissions</text>

  <rect class="asset" x="1170" y="810" width="315" height="126"/>
  <text class="label" x="1200" y="844">媒体资产数据库</text>
  <text class="text" x="1200" y="872">对象存储：S3 / Blob / 本地卷</text>
  <text class="small" x="1200" y="896">图片、视频、文档、画布附件</text>
  <text class="small" x="1200" y="918">SQL 保存 key、owner、workspace、大小</text>

  <line class="arrow-blue" x1="280" y1="252" x2="380" y2="278"/>
  <line class="arrow-blue" x1="280" y1="373" x2="380" y2="552"/>
  <line class="arrow-blue" x1="280" y1="500" x2="380" y2="698"/>
  <line class="arrow" x1="280" y1="652" x2="750" y2="286"/>

  <line class="arrow-blue" x1="650" y1="278" x2="750" y2="286"/>
  <line class="arrow-blue" x1="650" y1="408" x2="750" y2="429"/>
  <line class="arrow-blue" x1="650" y1="552" x2="750" y2="429"/>
  <line class="arrow-blue" x1="650" y1="698" x2="750" y2="574"/>
  <line class="arrow-blue" x1="650" y1="838" x2="750" y2="853"/>

  <line class="arrow-green" x1="1060" y1="286" x2="1170" y2="714"/>
  <line class="arrow-green" x1="1060" y1="429" x2="1170" y2="714"/>
  <line class="arrow-green" x1="1060" y1="574" x2="1170" y2="714"/>
  <line class="arrow-green" x1="1060" y1="713" x2="1170" y2="714"/>
  <line class="arrow-green" x1="1060" y1="853" x2="1170" y2="873"/>

  <line class="arrow" x1="1060" y1="429" x2="1170" y2="288"/>
  <line class="arrow" x1="1060" y1="713" x2="1170" y2="428"/>
  <line class="arrow-dashed" x1="1170" y1="288" x2="650" y2="278"/>
  <line class="arrow-dashed" x1="1170" y1="288" x2="650" y2="552"/>

  <path class="arrow-green" d="M515 466 C560 520 650 532 750 429"/>
  <text class="small" x="515" y="515">发布 / 上传</text>

  <path class="arrow" d="M905 493 C940 540 940 570 905 632"/>
  <text class="small" x="935" y="562">审核状态、进度指标</text>

  <path class="arrow-dashed" d="M1328 778 C1328 790 1328 798 1328 810"/>
  <text class="small" x="1352" y="800">文件元数据关联</text>

  <rect class="panel-soft" x="50" y="1000" width="1480" height="48"/>
  <text class="small" x="80" y="1030">图例：实线框 = 现有项目能力；虚线框 = 结合新增需求建议加入/扩展的模块；蓝色箭头 = 用户请求/API；绿色箭头 = 数据读写；灰色虚线 = 实时同步或元数据关联。</text>
</svg>
